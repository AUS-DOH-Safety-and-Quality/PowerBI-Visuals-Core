# Reusable: renders the calling repository's Quarto docs folder and deploys it to GitHub Pages
name: Deploy Quarto site to Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Render Site with Quarto
        # Outputs to docs/_site
        run: quarto render docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/_site/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
