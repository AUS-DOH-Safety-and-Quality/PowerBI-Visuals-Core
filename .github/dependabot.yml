# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      ts-dev-dependencies:
        patterns:
          - "*"
  # The visuals' workflows call the reusable workflows here, so the action versions are kept in this repo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gh-action-workflows:
        patterns:
          - "*"
