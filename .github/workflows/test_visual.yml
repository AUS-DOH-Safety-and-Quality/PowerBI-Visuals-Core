# Reusable: lints, packages and tests the calling visual's repository
name: Test Build PowerBI visual

on:
  workflow_call:

permissions:
  contents: read

env:
  # Away from UTC, so that date-only parsing is tested meaningfully
  TZ: Australia/Perth

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Install PBI visual Tools
      run: |
        npm install -g powerbi-visuals-tools

    - name: Install Package Dependencies
      run: |
        npm ci

    - name: Run linter
      run: |
        npm run eslint

    - name: Test if package can be built
      run: |
        npm run package

    - name: Run unit tests
      run: |
        sudo apt-get install -y fonts-liberation
        npx playwright install chromium
        npm run test

    - name: Attach built visual
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: powerbi-visual-${{ github.sha }}
        path: dist/*.pbiviz
